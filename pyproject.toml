[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgebot"
version = "1.0.0"
description = "Voice-commanded warehouse mobile manipulator: RL navigation, IK manipulation and conversational AI for edge devices"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mehul Khanna" }]
dependencies = [
    "numpy>=1.24",
    "torch>=2.5",
    "gymnasium>=0.29",
    "matplotlib>=3.7",
    "pillow>=10.0",
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4",
    "onnx>=1.15",
    "onnxruntime>=1.17",
    "onnxscript>=0.2",
    "scipy>=1.11",
    "soundfile>=0.12",
    "faster-whisper>=1.0",
    "piper-tts>=1.2",
    "transformers>=4.40",
]

[project.optional-dependencies]
mic = ["sounddevice>=0.4"]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["edgebot*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B007", "B023", "B905", "E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
